<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Genera Post Markdown</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    textarea, input, button { width: 100%; margin: 0.5rem 0; padding: 0.5rem; }
    label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Crea un nuovo post</h1>

  <label>Titolo</label>
  <input type="text" id="title" placeholder="Titolo del post" />

  <label>Categorie (separate da virgola)</label>
  <input type="text" id="categories" placeholder="es: categoria1, categoria2" />

  <label>Tag (separati da virgola)</label>
  <input type="text" id="tags" placeholder="es: tag1, tag2, tag3" />

  <label>Lingua</label>
  <input type="text" id="lang" value="en" />

  <label>Ref</label>
  <input type="text" id="ref" placeholder="Riferimento interno" />

  <label>Contenuto del post</label>
  <textarea id="body" rows="10" placeholder="Scrivi qui il contenuto..."></textarea>

  <button onclick="generaMarkdown()">Genera Markdown</button>

  <h2>Output Markdown</h2>
  <textarea id="output" rows="15" readonly></textarea>

  <script>
    function generaMarkdown() {
      const title = document.getElementById('title').value;
      const categories = document.getElementById('categories').value.split(',').map(c => c.trim());
      const tags = document.getElementById('tags').value.split(',').map(t => t.trim());
      const lang = document.getElementById('lang').value;
      const ref = document.getElementById('ref').value;
      const body = document.getElementById('body').value;

      const frontmatter = `---\nlayout: post\ntitle: ${title}\ncategories: [${categories.join(', ')}]\ntags: [${tags.join(', ')}]\nlang: ${lang}\nref: ${ref}\n---\n\n`;

      document.getElementById('output').value = frontmatter + body;
    }
  </script>
</body>
</html>
