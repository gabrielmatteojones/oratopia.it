<!DOCTYPE html>
<html>
<head>
  <title>Pagina Protetta</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f2f0, #e0e0e0); /* Sfondo sfumato */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .auth-container, .protected-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15); /* Ombra più pronunciata */
      text-align: center;
      width: 400px; /* Larghezza fissa per un aspetto più controllato */
      max-width: 90%; /* Adattabilità su schermi più piccoli */
    }

    h1, h2 {
      color: #333;
      margin-bottom: 30px;
      font-weight: 300; /* Peso del font più leggero */
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555;
      text-align: left;
      font-weight: 400;
    }

    input[type="text"], input[type="password"] {
      width: calc(100% - 24px);
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.3s ease, transform 0.2s ease-in-out; /* Aggiunta transizione */
    }

    button:hover {
      background-color: #0056b3;
      transform: scale(1.05); /* Leggero effetto di "sollevamento" al hover */
    }

    #message {
      color: #dc3545; /* Rosso più vivace per gli errori */
      margin-top: 15px;
      font-size: 16px;
    }

    .protected-content-inner {
      padding: 30px 0;
    }

    .protected-content-inner p {
      color: #333;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .logout-button {
      background-color: #6c757d; /* Grigio per il logout */
    }

    .logout-button:hover {
      background-color: #545b62;
    }
  </style>
</head>
<body>
  <div id="auth-form" class="auth-container">
    <h2>Accedi</h2>
    <label for="username">Nome Utente:</label>
    <input type="text" id="username" placeholder="Il tuo nome utente"><br>
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="La tua password"><br>
    <button onclick="authenticate()">Accedi</button>
    <p id="message"></p>
  </div>
  <div id="protected-content" class="protected-container" style="display:none;">
    <div class="protected-content-inner">
      <h1>Contenuto Protetto</h1>
      <p>Benvenuto! Questo è il contenuto esclusivo che è accessibile solo agli utenti autenticati.</p>
      <p>Sentiti libero di esplorare e goderti le informazioni riservate.</p>
      <button onclick="logout()" class="logout-button">Logout</button>
    </div>
  </div>

  <script>
    async function authenticate() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageElement = document.getElementById('message');
      const authForm = document.getElementById('auth-form');
      const protectedContent = document.getElementById('protected-content');

      const response = await fetch('/.netlify/functions/auth', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });

      const data = await response.json();

      if (data.authenticated) {
        authForm.style.display = 'none';
        protectedContent.style.display = 'block';
        localStorage.setItem('isAuthenticated', 'true');
      } else {
        messageElement.textContent = data.message;
      }
    }

    function logout() {
      document.getElementById('auth-form').style.display = 'block';
      document.getElementById('protected-content').style.display = 'none';
      localStorage.removeItem('isAuthenticated');
    }

    if (localStorage.getItem('isAuthenticated') === 'true') {
      document.getElementById('auth-form').style.display = 'none';
      document.getElementById('protected-content').style.display = 'block';
    }
  </script>
</body>
</html>
