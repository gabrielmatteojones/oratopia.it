<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login con Netlify Identity</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    button {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #059669;
    }

    #user-info {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Login con Netlify Identity</h1>

  <button onclick="netlifyIdentity.open('login')">Login</button>
  <button onclick="netlifyIdentity.open('signup')">Registrati</button>
  <button onclick="netlifyIdentity.logout()">Logout</button>

  <div id="user-info"></div>

  <script>
    netlifyIdentity.on('init', user => {
      updateUserUI(user);
    });

    netlifyIdentity.on('login', user => {
      updateUserUI(user);
      netlifyIdentity.close();
    });

    netlifyIdentity.on('logout', () => {
      updateUserUI(null);
    });

    function updateUserUI(user) {
      const userInfo = document.getElementById('user-info');
      if (user) {
        userInfo.textContent = `Ciao, ${user.user_metadata.full_name || user.email}`;
      } else {
        userInfo.textContent = 'Non sei loggato.';
      }
    }

    // Inizializza il widget al caricamento
    netlifyIdentity.init();
  </script>
</body>
</html>
