  <script>
    window.onload = function () {
      const loggedIn = localStorage.getItem("loggedIn");

      // Controllo corretto
      if (loggedIn !== "true") {
        // Non loggato → reindirizza
        window.location.href = "/login.html";
      }
    };
  </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
