<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Area Amministrazione | Netlify CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Bootstrap Italia -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.14.0/dist/css/bootstrap-italia.min.css" rel="stylesheet">

    <!-- CSS Comune di Bolzano -->
    <link rel="stylesheet" type="text/css" href="https://opencity.comune.bolzano.it/var/bolzano_opencity/cache/public/stylesheets/57b177e4d4d0d2d087c924e3d041d7cb_1690206125_all.css" />

    <link rel="stylesheet" type="text/css" href="/admin/custom.css" />

<style>
      body {
        background-color: #f7f9fc;
        font-family: "Titillium Web", sans-serif;
      }

      .admin-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 2rem;
      }

      .admin-container h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .admin-container .spinner-border {
        margin-top: 2rem;
      }
    </style>
  </head>

  <body>


    <!-- Netlify Identity Init -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>

    <!-- Netlify CMS App -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  </body>
</html>
